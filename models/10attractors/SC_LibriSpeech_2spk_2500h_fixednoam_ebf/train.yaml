# Stage 1/4 (OPTIONAL): fresh 2-speaker pretrain on the corrected Noam
# schedule. NOT part of the default five-day queue -- see the note below;
# run it only if the calibration gate says a full 148h pipeline fits.
#
# WHY THIS LINEAGE EXISTS
# -----------------------
# Every conformer / E-Branchformer run in results.csv (rows 21-25) was
# trained with noam_warmup_fraction: 0.10 -- the deficient schedule whose
# correction, on the otherwise-unchanged vanilla model, moved RAMC test DER
# 23.85 -> 20.80 (results.csv row 20; see
# models/10attractors/SC_LibriSpeech_2spk_2500h_paperlr/train.yaml for the
# full derivation and MEMORY.md's diaper-paperlr-noam-fix). The
# architecture runs were hit HARDER than vanilla was: they ran 4-GPU DDP
# with per-rank batches, so their optimiser took ~2.5-2.9x fewer steps than
# a single-GPU run over the same data, while noam_warmup_fraction silently
# re-derived itself from the shortened per-rank loader.
#
# So the architecture-vs-vanilla comparison has never been run on a correct
# schedule, and "the conformers lose to vanilla" is not yet an established
# fact. This lineage changes exactly one thing versus its source lineage:
# the Noam schedule, made explicit (never fraction-based -- fractions are
# not resume-stable) and given the paper's 53.7% ramp fraction at the batch
# size a single V100 can hold.
#
#
# UNVERIFIED CHUNK COUNT -- READ BEFORE USING THIS STAGE
# The 119,160 figure below comes from the same repo-wide assumption that the
# adapt stage's 19,888 did, and that one was measured on the server as
# 39,064 -- about 2x larger (see train_10spks.yaml's NOAM header). 2500h of
# 1-minute chunks should be ~150,000, so 119,160 is very likely low here
# too. Nobody has counted this cache. Since RUN_PRETRAIN defaults to 0 this
# stage normally never runs; if you do enable it, count the cache first:
#     ls <train_precomputed_dir> | wc -l
# then recompute with
#     python diaper/common_utils/noam_lr_calc.py --epochs 100 #         --iters-per-epoch $((count / 96)) --warmup-fraction 0.537 #         --peak-lr 1.712e-4
# and decide, as the adapt stage did, whether to match the paper's ramp
# fraction or the baseline lineage's realized one.
#
# NOAM PARAMETERS FOR train_batchsize: 96 ON ONE GPU
# ---------------------------------------------------
# Only needed if you run a fresh pretrain. The default five-day plan skips
# this stage and warm-starts the adapt stage from the existing 2500h
# pretrain checkpoint instead -- both conv families already reach pretrain
# dev DER 2.6-2.8 (vanilla's reached 10.0 on the same schedule), so the
# pretrain stage is the least likely place they are hurting, and reusing it
# keeps exactly one variable changed against results.csv.
#
# 2500h of 1-minute chunks is 119,160 chunks/epoch, so batch 96 gives 1,241
# steps/epoch and 124,100 steps over 100 epochs; warmup = 53.7% = 66,642.
# Peak LR IS sqrt-scaled here (the authors' pretrain batch of 32 is known):
# 9.882e-5 * sqrt(96/32) = 1.712e-4, which lands noam_model_size back on
# the paper's own 512 -- the same cancellation noted above.
#
# train_batchsize raised 80 -> 96 (the V100 ceiling at 600 frames) and
# num_workers 4 -> 8. If 96 OOMs for this encoder, fall back to 80 and use
# noam_model_size: 512 / noam_warmup_steps: 79959 instead.

