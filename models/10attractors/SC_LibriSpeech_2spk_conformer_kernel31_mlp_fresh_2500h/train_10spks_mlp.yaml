# Stage 2/3: adapt the 2500h mlp stage-1 pretrain (train.yaml in this
# directory) to 1-10 speakers.
#
# Same architecture/recipe as the 300h config
# (SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh/train_10spks_mlp.yaml,
# row 17's "mlp only" pipeline -- no attractor_diversity_unmasked_loss_weight),
# scaled to the paper's Table III step H ("Adaptation (multi-speaker SC)",
# set "SC1-10 16 kHz") data volume: each per-speaker-count SC set is 2500h
# (see this directory's train.yaml header).
#
# No allow_partial_warmstart here, same reasoning as the 300h sibling
# config: stage 1 in this directory already used latents2attractors: mlp,
# so a strict load_state_dict is expected to succeed.
#
# init_epochs: 90-100 -- same standard range used throughout this repo for
# a stage-1 checkpoint (see CLAUDE.md / MEMORY.md's init_epochs 90-100
# convention note).
#
# train_precomputed_dir / valid_precomputed_dir are deliberately left as
# placeholders -- the 2500h max-10-speakers SC set is still being generated
# as of this writing. Fill them in once precompute finishes.
#
# max_epochs unchanged (100), matching the paper's step H. dev_batchsize /
# train_batchsize also unchanged from the 300h config -- revisit only if
# the actual 2500h run needs it.

# training options
activation_loss_BCE_weight: 1.0
activation_loss_DER_weight: 0.0
attractor_existence_loss_weight: 1.0
attractor_frame_comparison: dotprod
attractor_diversity_loss_weight: 0.1
condition_frame_encoder: True
conformer_conv_kernel_size: 31
conv_norm_type: batchnorm
context_size: 7
d_latents: 128
detach_attractor_loss: False
dev_batchsize: 16
dropout_attractors: 0.1
dropout_frames: 0.1
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_encoder_type: conformer
frame_shift: 160
frame_size: 400
use_last_samples: True
gpu: 1
gradclip: 5
input_transform: logmel_meannorm
intermediate_loss_frameencoder: True
intermediate_loss_perceiver: False
latents2attractors: mlp
log_report_batches_num: 20
max_epochs: 100
model_type: AttractorPerceiver
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
noam_warmup_fraction: 0.10
norm_loss_per_spk: True
num_frames: 2400
num_speakers: 10
num_workers: 4
num_threads: 1
optimizer: noam
output_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h_adapted1-10_2500h_maximum10spks_mlp
pre_xa_heads: 4
sampling_rate: 16000
seed: 3
specaugment: False
subsampling: 10
time_shuffle: False
train_batchsize: 16
train_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_2500h_maximum_10spks_24000frames/train
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
valid_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_2500h_maximum_10spks_24000frames/validation
init_epochs: 90-100
init_model_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h_pretrain2500h/models
