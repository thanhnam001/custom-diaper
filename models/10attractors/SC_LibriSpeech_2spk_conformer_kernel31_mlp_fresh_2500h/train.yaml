# Stage 1/3 (SHARED): pretrain on 2-speaker LibriSpeech-simulated
# conversations with latents2attractors: mlp from the start.
#
# This is the SAME architecture/recipe as
# SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh/train.yaml (row 17 in
# results.csv: "Conformer base (mlp + conv_kernel_31 + diversity)") -- the
# only change in this directory is the SC data volume, scaled from 500h to
# 2500h to match the paper's Table III recipe (step G: "Training
# (2-speaker SC)", set "SC2 16 kHz", which per Section IV.A is 2500h of
# audio, same as every other per-speaker-count SC set). See CLAUDE.md's
# "Background reading" section for where that 2500h figure comes from.
#
# train_precomputed_dir / valid_precomputed_dir are deliberately left as
# placeholders -- the 2500h SC set is still being generated as of this
# writing. Fill them in once precompute finishes.
#
# max_epochs is unchanged (100), matching the paper's step G ("# max. ep."
# column) -- one epoch is still one full pass over the (now 5x larger) SC
# set, so noam_warmup_fraction: 0.10 auto-scales the warmup step count with
# the longer per-epoch schedule (see diaper/common_utils/noam_lr_calc.py).
# The paper instead fixes warm-up at 200k steps across all its own runs
# (Table III caption) -- this repo's fraction-based convention is kept here
# for consistency with every other lineage's stage-1 config, not changed
# per-run.
#
# train_batchsize / dev_batchsize are also left unchanged from the 500h
# config -- revisit only if GPU memory or step-time on the actual 2500h run
# turns out to need it.
#
# attractor_diversity_loss_weight: 0.1 (masked) active from stage 1, same
# rationale as the 500h config's header (isolating the mlp architecture
# from the start, avoiding a stage-1 collapsed-slot configuration that
# stage 2 would have to fight against).
#
# This checkpoint is the starting point for this lineage's stage 2
# (train_10spks_mlp.yaml in this directory).

# training options
activation_loss_BCE_weight: 1.0
activation_loss_DER_weight: 0.0
attractor_existence_loss_weight: 1.0
attractor_frame_comparison: dotprod
attractor_diversity_loss_weight: 0.1
condition_frame_encoder: True
conformer_conv_kernel_size: 31
conv_norm_type: batchnorm
context_size: 7
d_latents: 128
detach_attractor_loss: False
dev_batchsize: 80
dropout_attractors: 0.1
dropout_frames: 0.1
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_encoder_type: conformer
frame_shift: 160
frame_size: 400
use_last_samples: True
gpu: 1
gradclip: 5
input_transform: logmel_meannorm
intermediate_loss_frameencoder: True
intermediate_loss_perceiver: True
latents2attractors: mlp
log_report_batches_num: 20
max_epochs: 100
model_type: AttractorPerceiver
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
noam_warmup_fraction: 0.10
norm_loss_per_spk: True
num_frames: 600
num_speakers: 2
num_workers: 4
optimizer: noam
output_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h_pretrain2500h
pre_xa_heads: 4
sampling_rate: 16000
seed: 3
specaugment: False
subsampling: 10
time_shuffle: False
train_batchsize: 80
train_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_2500h_fixed_2spks/train
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
valid_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_2500h_fixed_2spks/validation
