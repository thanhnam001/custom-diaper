# Inference config for the MSDWild-finetuned checkpoint of this pipeline
# (finetune_msdwild_10spks.yaml's output_path/models_finetuneMSDWILD/models).
# Architecture options here must match train_10spks.yaml /
# finetune_msdwild_10spks.yaml in this directory (self-attention frame
# encoder, latents2attractors: linear) -- attractor_diversity_loss_weight is
# a training-only loss term (and disabled in this recipe anyway) and has no
# effect on inference, so it is not repeated here.
#
# median_window_length: 11 / subsampling: 10 follow the paper's
# collar-dependent post-processing rule for MSDWild's 0.25s collar (see
# infer_msdwild.yaml's header comment in SC_LibriSpeech_2spk_conformer_kernel31/
# for the full rationale) -- do not copy infer_ramc.yaml's values
# (median_window_length: 1 / subsampling: 5) here.
#
# epochs is intentionally left out: no checkpoints for this experiment
# exist locally yet under experiments/10attractors/SC_LibriSpeech_2spk_linear_nodiversity_adapted1-10_300h_maximum10spks/
# models_finetuneMSDWILD/models (finetune_msdwild_10spks.yaml in this
# directory hasn't been run, or its output hasn't been synced from the
# server). Once checkpoints exist, pick a range from experiments/ (not a
# guess) -- e.g. the last 10 kept after pruning, or from the best dev-DER
# plateau in TensorBoard. infer_data_dir/models_path/rttms_dir below have
# working defaults but can also be overridden the same way. Example:
#
#   python diaper/infer.py \
#       -c models/10attractors/SC_LibriSpeech_2spk_linear_nodiversity/infer_msdwild.yaml \
#       --epochs 700-750 \
#       --infer-data-dir /path/to/other/test/set \
#       --models-path /path/to/other/models \
#       --rttms-dir /path/to/output

# inference options
condition_frame_encoder: True
context_size: 7
d_latents: 128
dropout_attractors: 0.1
dropout_frames: 0.1
estimate_spk_qty: -1
estimate_spk_qty_thr: 0.5
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_shift: 160
frame_size: 400
gpu: 1
infer_data_dir: /data/ocr/namvt17/dataset/diarization/msdwild/kaldi/test
input_transform: logmel_meannorm
latents2attractors: linear
median_window_length: 11
model_type: AttractorPerceiver
models_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_linear_nodiversity_adapted1-10_300h_maximum10spks/models_finetuneMSDWILD/models
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
num_frames: -1
num_speakers: 10
pre_xa_heads: 4
rttms_dir: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_linear_nodiversity_adapted1-10_300h_maximum10spks/models_finetuneMSDWILD/msdwild_test_pred
sampling_rate: 16000
seed: 3
subsampling: 10
time_shuffle: False
threshold: 0.5
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
