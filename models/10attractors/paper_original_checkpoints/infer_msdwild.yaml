# Inference config for the paper's OWN pretrained checkpoint
# (adapted1-10 -> finetuneMSDWILD), as shipped in the original upstream repo
# at ../Master/repos/DiaPer/models/10attractors/
# SC_LibriSpeech_2spk_adapted1-10_finetuneMSDWILD/models. Used to sanity
# check our infer.py/dscore pipeline against the paper's own published
# results/DiaPer/10attractors/MSDWild/withFT/few.val numbers (DER 15.46%),
# and as a from-the-paper reference point alongside our own from-scratch
# reproduction (models/10attractors/SC_LibriSpeech_2spk_conformer_kernel31).
#
# Architecture matches the plain (non-conformer) adapted1-10 recipe:
# self-attention frame encoder, latents2attractors: weighted_average -- see
# ../SC_LibriSpeech_2spk_adapted1-10/train_10spks.yaml.
#
# epochs: 515-525 -> averages checkpoints 516-525 (parser's "N-1 to M"
# convention), all 10 checkpoints shipped for this experiment.
#
# median_window_length: 11 / subsampling: 10 follow the paper's
# collar-dependent post-processing rule for MSDWild's 0.25s collar.

# inference options
condition_frame_encoder: True
context_size: 7
d_latents: 128
dropout_attractors: 0.1
dropout_frames: 0.1
epochs: 515-525
estimate_spk_qty: -1
estimate_spk_qty_thr: 0.5
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_shift: 160
frame_size: 400
gpu: 0
infer_data_dir: database/msdwild/kaldi/test
input_transform: logmel_meannorm
latents2attractors: weighted_average
median_window_length: 11
model_type: AttractorPerceiver
models_path: ../Master/repos/DiaPer/models/10attractors/SC_LibriSpeech_2spk_adapted1-10_finetuneMSDWILD/models
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
num_frames: -1
num_speakers: 10
pre_xa_heads: 4
rttms_dir: ./results/paper_original_checkpoints/msdwild_test
sampling_rate: 16000
seed: 3
subsampling: 10
time_shuffle: False
threshold: 0.5
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
