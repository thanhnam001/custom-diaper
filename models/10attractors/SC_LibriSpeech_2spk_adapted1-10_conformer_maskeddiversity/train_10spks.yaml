# Stage 1/3 (of this pipeline -- no separate pretrain stage): adapt the
# existing 2-speaker conformer pretrained model (conv kernel 3, batchnorm --
# models/10attractors/SC_LibriSpeech_2spk_conformer/train_conv_kernel3.yaml's
# checkpoints) to 1-10 speakers using the 300h "maximum 10 speakers"
# simulated dataset. init_model_path is therefore unchanged from
# models/10attractors/SC_LibriSpeech_2spk_adapted1-10_conformer/train_conv_kernel3_10spks.yaml
# -- this pipeline reuses that same 2-speaker pretrained checkpoint rather
# than retraining it.
#
# Loss-composition variant of that same baseline
# (train_conv_kernel3_10spks.yaml): everything architectural is identical
# (kernel size 3, conv_norm_type: batchnorm default, latents2attractors:
# weighted_average); only two loss weights change:
#   - l2a_entropy_loss_weight: 0.0 -- drops the latents2attractors:
#     weighted_average entropy term (per_prcvblock_l2a_entropy_term) that
#     the baseline adds unweighted (see diaper/train.py::
#     compute_loss_and_metrics); default is 1.0 everywhere else.
#   - attractor_diversity_loss_weight: 0.1 -- enables
#     masked_attractor_diversity_loss instead (existence-mask-restricted
#     orthogonality penalty on the final layer's per-sequence attractors,
#     see backend/losses.py), in place of the entropy term.
# noam_model_size/noam_warmup_steps are carried over unchanged from the
# baseline: that schedule is derived purely from max_epochs, batch size and
# dataset size (see backend/updater.py::compute_noam_params), not from the
# loss composition, so it does not need recomputing here.

# training options
activation_loss_BCE_weight: 1.0
activation_loss_DER_weight: 0.0
attractor_diversity_loss_weight: 0.1
attractor_existence_loss_weight: 1.0
attractor_frame_comparison: dotprod
condition_frame_encoder: True
conformer_conv_kernel_size: 3
context_size: 7
d_latents: 128
detach_attractor_loss: False
dev_batchsize: 16
dropout_attractors: 0.1
dropout_frames: 0.1
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_encoder_type: conformer
frame_shift: 160
frame_size: 400
use_last_samples: True
gpu: 1
gradclip: 5
input_transform: logmel_meannorm
intermediate_loss_frameencoder: True
intermediate_loss_perceiver: True
l2a_entropy_loss_weight: 0.0
latents2attractors: weighted_average
log_report_batches_num: 20
max_epochs: 100
model_type: AttractorPerceiver
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
noam_model_size: 34713
noam_warmup_steps: 2950
norm_loss_per_spk: True
num_frames: 2400
num_speakers: 10
num_workers: 8
num_threads: 1
optimizer: noam
output_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_adapted1-10_conformer_maskeddiversity_300h_maximum10spks
pre_xa_heads: 4
sampling_rate: 16000
seed: 3
specaugment: False
subsampling: 10
time_shuffle: False
train_batchsize: 16
train_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_300h_maximum_10spks_24000frames/train
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
valid_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_300h_maximum_10spks_24000frames/validation
init_epochs: 90-100
init_model_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_conv_kernel3_pretrain500h/models
