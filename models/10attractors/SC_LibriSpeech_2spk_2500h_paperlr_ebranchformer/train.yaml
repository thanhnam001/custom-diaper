# E-BRANCHFORMER FRAME-ENCODER ABLATION
# =====================================
# This lineage started as SC_LibriSpeech_2spk_2500h_paperlr with exactly
# one variable changed: frame_encoder_type: ebranchformer instead of
# self_attention. It has since diverged from that baseline on two more
# axes -- loss composition and Noam schedule -- both deliberate, see "LOSS
# COMPOSITION" and "NOAM SCHEDULE" below. Sequence lengths and epoch
# budgets are still unchanged from the paperlr baseline.
#
# WHY E-BRANCHFORMER, AND NOT ZIPFORMER
# -------------------------------------
# Where Conformer chains self-attention then convolution, E-Branchformer
# runs them as parallel branches and merges the two with a depthwise conv
# over time (see backend/models.py::EBranchformerBlock). It is a pure block
# swap: same input, same output, same frame rate, no new optimizer, no
# custom CUDA kernels.
#
# Zipformer was considered and rejected for a structural reason specific to
# DiaPer, not a general one. Zipformer's gains come from a U-Net-like stack
# that downsamples to several different frame rates internally. DiaPer's
# frame encoder cannot tolerate that: with condition_frame_encoder: True
# the attractor-vs-frame activation logits are fed back into the encoder
# between every layer, and intermediate_loss_frameencoder supervises every
# layer's output against frame-rate labels. Both require each layer to stay
# frame-aligned with the input, which a multi-rate stack breaks by
# construction. Adapting it would mean rebuilding the conditioning and
# intermediate-loss machinery -- a different project, not a backbone swap.
#
# WHAT THIS DOES NOT FIX
# ----------------------
# Attention here is still O(T^2) in sequence length. E-Branchformer changes
# what runs alongside attention, not attention itself, so it does NOT
# relieve the whole-recording memory ceiling that makes RAMC inference
# (num_frames: -1, subsampling: 5) impossible on the local 6GB GPU. Only a
# linear-time sequence mixer would, and that was deliberately out of scope.
#
# SIZE
# ----
# ebranchformer_cgmlp_units is left unset, so it defaults to 4 * d_latents
# = 512. At that setting one block is ~1.38M params vs ~1.17M for a
# kernel-31 ConformerBlock (1.17x) -- close enough that a
# conformer-vs-ebranchformer comparison is about architecture rather than
# capacity. Setting it to frame_encoder_units (2048) instead would make it
# 1.72x, which would confound the comparison; raise it only deliberately.
#
# LOSS COMPOSITION: mlp + diversity, NOT weighted_average + l2a entropy
# -----------------------------------------------------------------------
# This lineage does NOT inherit the paperlr baseline's
# latents2attractors: weighted_average. It instead follows
# SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h (the "Conformer
# base (mlp + conv_kernel_31 + diversity)" recipe): latents2attractors:
# mlp from stage 1 onward, with attractor_diversity_loss_weight: 0.1
# (masked) active from the start, so mlp's attractor-vector separation is
# never a variable stage 2 has to fight into an already-collapsed
# checkpoint. l2a_entropy_loss_weight is explicitly set to 0.0 rather than
# left at its default 1.0 -- it is a no-op for latents2attractors: mlp
# regardless (see train.py's docstring for that arg), but the explicit 0.0
# documents that this lineage does not want it active even incidentally,
# and keeps every stage of the lineage consistent since a later change to
# latents2attractors would otherwise silently reactivate it.
#
# This is a deliberate divergence from the paperlr baseline (which uses
# weighted_average throughout, matching the paper's own architecture) --
# the point of this lineage is E-Branchformer combined with the
# collapse-resistant mlp + diversity loss composition.
#
# NOAM SCHEDULE: NOT the paperlr correction -- matches the mlp reference
# ------------------------------------------------------------------------
# Despite this directory's name, this config does NOT use the paperlr
# lineage's batch-scaled/explicit Noam correction (train_batchsize: 128,
# noam_model_size: 512, noam_warmup_steps: 50000 -- see
# SC_LibriSpeech_2spk_2500h_paperlr/train.yaml for that derivation).
# Deliberately excluded from this experiment: noam_warmup_fraction: 0.10
# with train_batchsize: 80 is used instead, identical to
# SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h/train.yaml (the
# mlp+diversity reference this lineage's loss composition is based on) --
# so the Noam/batch setup is the one variable that stays a true no-op
# relative to that reference, and E-Branchformer vs Conformer is the only
# thing this ablation is measuring at that reference's own optimization
# budget, not the paperlr-corrected one.
#
# Stage 1/4: pretrain on 2-speaker LibriSpeech-simulated conversations, at
# the paper's Table III data scale (2500h) -- see
# SC_LibriSpeech_2spk_2500h_paperlr/train.yaml for the analysis of why the
# paperlr lineage's batch/Noam correction exists at all (not applied here,
# per above).
#
# Data: same 2500h 2-speaker SC precompute as the paperlr sibling. Note the
# paper's SC path carries a --no-use-energies suffix ours does not; that
# was checked against ../../../../Master/repos/EEND_dataprep and
# `use_energies` there only ever builds a directory name -- it is never set
# and never passed to any generation script, so the difference is cosmetic.

# training options
activation_loss_BCE_weight: 1.0
activation_loss_DER_weight: 0.0
attractor_existence_loss_weight: 1.0
attractor_frame_comparison: dotprod
attractor_diversity_loss_weight: 0.1
condition_frame_encoder: True
context_size: 7
d_latents: 128
detach_attractor_loss: False
dev_batchsize: 80
dropout_attractors: 0.1
dropout_frames: 0.1
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_type: ebranchformer
frame_encoder_units: 2048
frame_shift: 160
frame_size: 400
use_last_samples: True
gpu: 1
gradclip: 5
input_transform: logmel_meannorm
intermediate_loss_frameencoder: True
intermediate_loss_perceiver: True
l2a_entropy_loss_weight: 0.0
latents2attractors: mlp
log_report_batches_num: 256
max_epochs: 100
model_type: AttractorPerceiver
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
noam_warmup_fraction: 0.10
norm_loss_per_spk: True
num_frames: 600
num_speakers: 2
num_workers: 4
num_threads: 1
optimizer: noam
output_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_2500h_paperlr_ebf_pretrain2500h_mlp
pre_xa_heads: 4
sampling_rate: 16000
seed: 3
specaugment: False
subsampling: 10
time_shuffle: False
train_batchsize: 80
train_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_2500h_fixed_2spks/train
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
valid_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_2500h_fixed_2spks/validation
