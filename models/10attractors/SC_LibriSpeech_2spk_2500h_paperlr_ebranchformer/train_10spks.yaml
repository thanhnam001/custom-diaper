# Stage 2/4: adapt this lineage's 2500h 2-speaker pretrain (train.yaml in
# this directory) to 1-10 speakers on 2500h of multi-speaker SC.
#
# See train.yaml's "NOAM SCHEDULE" section: despite this directory's name,
# this stage does NOT use the paperlr lineage's batch-scaled/explicit Noam
# correction (train_batchsize: 22, noam_model_size: 2111,
# noam_warmup_steps: 48500 -- see SC_LibriSpeech_2spk_2500h_paperlr/
# train_10spks.yaml for that derivation). noam_warmup_fraction: 0.10 with
# train_batchsize: 16 is used instead, identical to
# SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h/
# train_10spks_mlp.yaml.
#
# LOSS COMPOSITION carried forward from train.yaml's stage-1 checkpoint:
# latents2attractors: mlp, attractor_diversity_loss_weight: 0.1,
# l2a_entropy_loss_weight: 0.0 (see train.yaml's "LOSS COMPOSITION"
# section for why). intermediate_loss_perceiver is turned off here (True
# at stage 1, False here), matching
# SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h/train_10spks_mlp.
# yaml's stage-2 config -- the 3 PerceiverEncoders are chained
# sequentially with a single shared existence head across blocks, so deep
# supervision at every block fights the same shared-weight gradient
# conflict the mlp/diversity change is meant to relieve on the slot axis
# (see that reference file's header for the fuller argument).
#
# num_frames: 2400 = 4-minute sequences, matching the paper: "all DiaPer
# models were adapted to the set of 1-10 speakers per recording using
# sequences of 4 minutes" (Section V-E), motivated in Section V-D by
# 1-minute sequences averaging only 3.6 speakers vs 5.2 for 4-minute ones.
# Unchanged from the sibling lineage, which already had this right.
#
# init_epochs: 90-100 -- standard warmstart convention for a stage-1
# checkpoint (see CLAUDE.md / MEMORY.md), and matches the paper's Table III
# step H ("Init. (# ep.)" = "G (90-100)").
#
# No intermediate 5-speaker stage, matching Table III (step G -> H directly)
# and every 2500h-scale lineage in this repo.

# training options
activation_loss_BCE_weight: 1.0
activation_loss_DER_weight: 0.0
attractor_existence_loss_weight: 1.0
attractor_frame_comparison: dotprod
attractor_diversity_loss_weight: 0.1
condition_frame_encoder: True
context_size: 7
d_latents: 128
detach_attractor_loss: False
dev_batchsize: 16
dropout_attractors: 0.1
dropout_frames: 0.1
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_type: ebranchformer
frame_encoder_units: 2048
frame_shift: 160
frame_size: 400
use_last_samples: True
gpu: 1
gradclip: 5
init_epochs: 90-100
init_model_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_2500h_paperlr_ebf_pretrain2500h_mlp/models
input_transform: logmel_meannorm
intermediate_loss_frameencoder: True
intermediate_loss_perceiver: False
l2a_entropy_loss_weight: 0.0
latents2attractors: mlp
log_report_batches_num: 24
max_epochs: 100
model_type: AttractorPerceiver
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
noam_warmup_fraction: 0.10
norm_loss_per_spk: True
num_frames: 2400
num_speakers: 10
num_workers: 4
num_threads: 1
optimizer: noam
output_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_2500h_paperlr_ebf_adapted1-10_2500h_maximum10spks_mlp
pre_xa_heads: 4
sampling_rate: 16000
seed: 3
specaugment: False
subsampling: 10
time_shuffle: False
train_batchsize: 16
train_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_2500h_maximum_10spks_24000frames/train
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
valid_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_2500h_maximum_10spks_24000frames/validation
