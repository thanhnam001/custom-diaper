# Inference config for this lineage's RAMC-finetuned checkpoint
# (finetune_ramc_10spks.yaml's output_path/models).
#
# Architecture options must stay in sync with train.yaml /
# train_10spks.yaml / finetune_ramc_10spks.yaml in this directory
# (self_attention frame encoder, latents2attractors: weighted_average).
#
# median_window_length: 1 / subsampling: 5 -- RAMC is scored with a 0s
# forgiveness collar, and per Section IV.D the paper applies NO median
# filter in that case and subsamples 5 frames instead of 10 for finer
# output resolution. These are the opposite of infer_msdwild.yaml's values
# (median 11 / subsampling 10, for its 0.25s collar); do not copy between
# the two. See CLAUDE.md's "Evaluation" section.
#
# HARDWARE WARNING: num_frames: -1 (whole-recording inference, required so
# attractor/speaker identity stays consistent across a recording) combined
# with subsampling: 5 makes this config unrunnable on the local 6GB
# machine -- the plain self-attention frame encoder needs a self-attention
# matrix over ~30k frame tokens for a 30-minute RAMC recording. A previous
# attempt OOM'd trying to allocate 22GB for a single file and 0/43 test
# files fit. Run RAMC inference on the server. (This limit is a property of
# the attention frame encoder, and is one of the things the E-Branchformer
# lineage does NOT fix -- see models/10attractors/
# SC_LibriSpeech_2spk_2500h_paperlr_ebranchformer/train.yaml.)
#
# epochs is intentionally omitted: no checkpoints exist for this lineage
# yet. scripts/run_infer_2500h_paperlr.sh auto-detects and averages the
# last 10 checkpoints, or pass a range explicitly.
#
# Target for comparison: the paper's published RAMC-with-FT DER of 21.1.
# The sibling SC_LibriSpeech_2spk_2500h lineage reached 23.85 here.

# inference options
condition_frame_encoder: True
context_size: 7
d_latents: 128
dropout_attractors: 0.1
dropout_frames: 0.1
estimate_spk_qty: -1
estimate_spk_qty_thr: 0.5
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_type: ebranchformer
frame_encoder_units: 2048
frame_shift: 160
frame_size: 400
gpu: 1
infer_data_dir: /data/ocr/namvt17/dataset/diarization/ramc/kaldi/test
input_transform: logmel_meannorm
latents2attractors: weighted_average
median_window_length: 1
model_type: AttractorPerceiver
models_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_2500h_paperlr_ebf_adapted1-10_2500h_maximum10spks/models_finetuneRAMC/models
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
num_frames: -1
num_speakers: 10
pre_xa_heads: 4
rttms_dir: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_2500h_paperlr_ebf_adapted1-10_2500h_maximum10spks/models_finetuneRAMC/ramc_test_pred
sampling_rate: 16000
seed: 3
subsampling: 5
time_shuffle: False
threshold: 0.5
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
