# Stage 1/3: pretrain on 2-speaker LibriSpeech-simulated conversations (500h).
# Single-variable variant of models/10attractors/SC_LibriSpeech_2spk_conformer/
# train_conv_kernel3.yaml (the current best-tuned conformer recipe, kernel
# size 3): the only changes here are conv_norm_type: batchnorm (explicit,
# same as that baseline's default -- see
# models/10attractors/SC_LibriSpeech_2spk_conformer_layernorm for the
# LayerNorm variant this was cloned from) and conformer_conv_kernel_size: 5.
# Everything else -- latents2attractors: weighted_average included -- is
# left exactly as in the baseline conformer recipe so this isolates that one
# change (kernel size); it does not carry over conv_norm_type: layernorm,
# latents2attractors: linear, or the attractor diversity loss from the other
# conformer/linear_diversity pipelines.
#
# noam_model_size / noam_warmup_steps are again omitted: train.py
# auto-computes them from max_epochs * (precomputed train set size /
# train_batchsize) with a 10% warmup fraction and the validated default
# peak LR (see diaper/common_utils/noam_lr_calc.py).

# training options
activation_loss_BCE_weight: 1.0
activation_loss_DER_weight: 0.0
attractor_existence_loss_weight: 1.0
attractor_frame_comparison: dotprod
condition_frame_encoder: True
conformer_conv_kernel_size: 5
conv_norm_type: batchnorm
context_size: 7
d_latents: 128
detach_attractor_loss: False
dev_batchsize: 80
dropout_attractors: 0.1
dropout_frames: 0.1
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_encoder_type: conformer
frame_shift: 160
frame_size: 400
use_last_samples: True
gpu: 1
gradclip: 5
input_transform: logmel_meannorm
intermediate_loss_frameencoder: True
intermediate_loss_perceiver: True
latents2attractors: weighted_average
log_report_batches_num: 20
max_epochs: 100
model_type: AttractorPerceiver
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
noam_warmup_fraction: 0.10
norm_loss_per_spk: True
num_frames: 600
num_speakers: 2
num_workers: 4
optimizer: noam
output_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel5_pretrain500h
pre_xa_heads: 4
sampling_rate: 16000
seed: 3
specaugment: False
subsampling: 10
time_shuffle: False
train_batchsize: 80
train_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_500h_fixed_2spks
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
valid_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_500h_fixed_2spks_validation
