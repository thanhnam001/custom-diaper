# Stage 3: finetune the mlp_unmaskeddiv stage-2 checkpoint
# (train_10spks_mlp_unmaskeddiv.yaml's output_path/models) on MSDWild.
#
# Single-variable variant of finetune_msdwild_10spks_l2aentropy0.yaml in
# this directory: init_model_path points at train_10spks_mlp_unmaskeddiv.
# yaml's output instead of train_10spks_l2aentropy0.yaml's, and the loss
# composition that produced that checkpoint is carried forward unchanged
# rather than reset to the weighted_average/l2a-entropy-0 recipe:
#   - latents2attractors: mlp (was weighted_average)
#   - l2a_entropy_loss_weight omitted (no-op for mlp, see train.py's
#     docstring for that arg) rather than set to 0.0
#   - attractor_diversity_loss_weight: 0.1 and
#     attractor_diversity_unmasked_loss_weight: 0.05 carried forward from
#     stage 2 so finetuning on MSDWild doesn't undo whatever separation
#     those two losses achieved -- letting them lapse mid-lineage would
#     make it unclear whether any collapse seen after finetuning came from
#     MSDWild's harder domain or just from removing the pressure that was
#     holding the slots apart
#   - intermediate_loss_perceiver: False (was True in the l2aentropy0
#     lineage) -- see train_10spks_mlp_unmaskeddiv.yaml's header for why
# Everything else (lr, max_epochs, data dirs) is unchanged from
# finetune_msdwild_10spks_l2aentropy0.yaml.
#
# No allow_partial_warmstart here (unlike the stage-2 config): the stage-2
# checkpoint was already trained with latents2attractors: mlp, so its
# latents2attractors.fc1.*/fc2.* keys match this config's model directly --
# a strict load_state_dict is correct, and if it ever errors here that's a
# real mismatch worth investigating, not the expected weighted_average ->
# mlp key gap from stage 1 -> stage 2.
#
# init_epochs: 90-100 is a placeholder matching the range used to evaluate
# earlier stage-2 checkpoints so far -- swap in whichever epoch(s) actually
# look best on train_10spks_mlp_unmaskeddiv.yaml's dev DER/dev
# attractor_diversity_unmasked_loss in TensorBoard once that run finishes.
#
# After finetuning, evaluate the same way as the other kernel31 MSDWild
# runs:
#   python diaper/eval_checkpoint.py -c <this file> --init-epochs <range>
#   python diaper/analyze_attractor_branch.py -c <this file> --init-epochs <range>
#   python diaper/attractor_collapse_analysis.py -c <this file> --init-epochs <range>
# (all three read valid_precomputed_dir from this config and
# init-model-path/init-epochs from the CLI/config as the checkpoint under
# test.)

# training options
activation_loss_BCE_weight: 1.0
activation_loss_DER_weight: 0.0
attractor_existence_loss_weight: 1.0
attractor_frame_comparison: dotprod
attractor_diversity_loss_weight: 0.1
attractor_diversity_unmasked_loss_weight: 0.05
condition_frame_encoder: True
conformer_conv_kernel_size: 31
conv_norm_type: batchnorm
context_size: 7
d_latents: 128
detach_attractor_loss: False
dev_batchsize: 128
dropout_attractors: 0.1
dropout_frames: 0.1
early_stopping: true
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_encoder_type: conformer
frame_shift: 160
frame_size: 400
use_last_samples: True
gpu: 1
gradclip: 5
init_epochs: 90-100
init_model_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_adapted1-10_300h_maximum10spks_mlp_unmaskeddiv/models
input_transform: logmel_meannorm
intermediate_loss_frameencoder: True
intermediate_loss_perceiver: False
latents2attractors: mlp
log_report_batches_num: 10
lr: 1e-6
max_epochs: 750
model_type: AttractorPerceiver
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
norm_loss_per_spk: True
num_frames: 600
num_speakers: 10
num_workers: 4
num_threads: 1
optimizer: adam
output_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_adapted1-10_300h_maximum10spks_mlp_unmaskeddiv/models_finetuneMSDWILD
pre_xa_heads: 4
sampling_rate: 16000
seed: 3
specaugment: False
subsampling: 10
time_shuffle: False
train_batchsize: 32
train_precomputed_dir: /data/ocr/namvt17/dataset/diarization/msdwild_precompute_6000frames/train
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
valid_precomputed_dir: /data/ocr/namvt17/dataset/diarization/msdwild_precompute_6000frames/dev
