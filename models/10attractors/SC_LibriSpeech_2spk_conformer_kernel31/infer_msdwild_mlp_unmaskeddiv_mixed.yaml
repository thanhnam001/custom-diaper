# Inference config for the mlp_unmaskeddiv MSDWild-finetuned checkpoint
# trained on the data-mix variant (finetune_msdwild_10spks_mlp_
# unmaskeddiv_mixed.yaml's output_path/models_finetuneMSDWILD_mix_min_8spks/
# models).
#
# Single-variable variant of infer_msdwild_mlp_unmaskeddiv.yaml in this
# directory: only models_path/rttms_dir point at the mixed-data experiment's
# output_path instead of the plain (MSDWild-only) one. Architecture is
# identical between the two (same latents2attractors: mlp, same conformer/
# batchnorm/subsampling settings) since the mixed run only changes
# train_precomputed_dir -- infer.py doesn't take attractor-diversity-loss-
# weight/attractor-diversity-unmasked-loss-weight/intermediate-loss-* at all
# (training-only), so nothing about the loss composition needs to be
# carried over here either way.
#
# epochs is intentionally left out: finetune_msdwild_10spks_mlp_
# unmaskeddiv_mixed.yaml hasn't been run yet, so there's no dev DER curve to
# pick a range from. Once it finishes, compare its dev attractor_accuracy/
# DER trajectory in TensorBoard against the non-mixed
# finetune_msdwild_10spks_mlp_unmaskeddiv.yaml run (which plateaus around
# dev DER 52.4-52.6%, attractor_accuracy ~72%) to see whether the replay
# data actually helped, pick a range from whichever plateau this run
# settles into, then pass epochs (and override infer_data_dir/models_path/
# rttms_dir if needed) on the command line:
#
#   python diaper/infer.py \
#       -c models/10attractors/SC_LibriSpeech_2spk_conformer_kernel31/infer_msdwild_mlp_unmaskeddiv_mixed.yaml \
#       --epochs <range> \
#       --infer-data-dir /path/to/other/test/set \
#       --models-path /path/to/other/models \
#       --rttms-dir /path/to/output

# inference options
condition_frame_encoder: True
conformer_conv_kernel_size: 31
conv_norm_type: batchnorm
context_size: 7
d_latents: 128
dropout_attractors: 0.1
dropout_frames: 0.1
estimate_spk_qty: -1
estimate_spk_qty_thr: 0.5
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_encoder_type: conformer
frame_shift: 160
frame_size: 400
gpu: 1
infer_data_dir: /data/ocr/namvt17/dataset/diarization/msdwild/kaldi/test
input_transform: logmel_meannorm
latents2attractors: mlp
median_window_length: 1
model_type: AttractorPerceiver
models_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_adapted1-10_300h_maximum10spks_mlp_unmaskeddiv/models_finetuneMSDWILD_mix_min_8spks/models
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
num_frames: -1
num_speakers: 10
pre_xa_heads: 4
rttms_dir: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_adapted1-10_300h_maximum10spks_mlp_unmaskeddiv/models_finetuneMSDWILD_mix_min_8spks/msdwild_test_pred
sampling_rate: 16000
seed: 3
subsampling: 5
time_shuffle: False
threshold: 0.5
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
