# Stage 3 (variant): finetune the l2a-entropy-0 stage-2 checkpoint
# (train_10spks_l2aentropy0.yaml's output_path/models) on MSDWild.
#
# Single-variable variant of finetune_msdwild_10spks.yaml in this
# directory: init_model_path points at train_10spks_l2aentropy0.yaml's
# output instead of train_10spks.yaml's, and l2a_entropy_loss_weight: 0.0
# is carried forward so this stage doesn't silently reintroduce the
# default-1.0 entropy term partway through the lineage. Everything else
# (lr, max_epochs, data dirs) is unchanged.
#
# init_epochs: 90-100 is a placeholder matching the range used to evaluate
# the stage-2 checkpoint so far -- swap in whichever epoch(s) actually look
# best on train_10spks_l2aentropy0.yaml's dev loss in TensorBoard once
# that run has more checkpoints to compare.
#
# After finetuning, evaluate the same way as the original kernel31 MSDWild
# run:
#   python diaper/eval_checkpoint.py -c <this file> --init-epochs <range>
#   python diaper/analyze_attractor_branch.py -c <this file> --init-epochs <range>
# (both scripts read valid_precomputed_dir from this config and
# init-model-path/init-epochs from the CLI/config as the checkpoint under
# test -- see the note on that distinction from the stage-2 analysis run.)

# training options
activation_loss_BCE_weight: 1.0
activation_loss_DER_weight: 0.0
attractor_existence_loss_weight: 1.0
attractor_frame_comparison: dotprod
condition_frame_encoder: True
conformer_conv_kernel_size: 31
conv_norm_type: batchnorm
context_size: 7
d_latents: 128
detach_attractor_loss: False
dev_batchsize: 128
dropout_attractors: 0.1
dropout_frames: 0.1
early_stopping: true
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_encoder_type: conformer
frame_shift: 160
frame_size: 400
use_last_samples: True
gpu: 1
gradclip: 5
init_epochs: 90-100
init_model_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_adapted1-10_300h_maximum10spks_l2aentropy0/models
input_transform: logmel_meannorm
intermediate_loss_frameencoder: True
intermediate_loss_perceiver: True
l2a_entropy_loss_weight: 0.0
latents2attractors: weighted_average
log_report_batches_num: 10
lr: 1e-6
max_epochs: 750
model_type: AttractorPerceiver
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
norm_loss_per_spk: True
num_frames: 600
num_speakers: 10
num_workers: 4
num_threads: 1
optimizer: adam
output_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_adapted1-10_300h_maximum10spks_l2aentropy0/models_finetuneMSDWILD
pre_xa_heads: 4
sampling_rate: 16000
seed: 3
specaugment: False
subsampling: 10
time_shuffle: False
train_batchsize: 32
train_precomputed_dir: /data/ocr/namvt17/dataset/diarization/msdwild_precompute_6000frames/train
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
valid_precomputed_dir: /data/ocr/namvt17/dataset/diarization/msdwild_precompute_6000frames/dev
