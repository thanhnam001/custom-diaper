# Stage 3/3 (MSDWild), speaker-counting-head ablation: finetune the
# SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h_spkcounting
# lineage's stage-2 (adapt) checkpoint on MSDWild, with the speaker-counting
# head turned OFF for this stage only.
#
# Why: a tensorboard read of dev_spk_counting_accuracy/loss across that
# lineage's existing runs found the head genuinely broken specifically
# during MSDWild finetuning -- dev accuracy collapses from 21% (first eval)
# to 2-4% for virtually the entire 428-step finetune run and never
# recovers, well below the ~50-56% a trivial "always guess 2 speakers"
# baseline would get on MSDWild's real speaker-count distribution, while
# train accuracy climbs to ~75-78% (a clean overfit/miscalibration split).
# dev_spk_counting_loss creeps upward for the whole run in both the plain
# spkcounting lineage and its overlaploss3 sibling, so this isn't an
# artifact of either lineage's specific hyperparameters -- it looks
# intrinsic to this head plus the MSDWild finetune stage (most likely: it
# learned the adapt stage's near-uniform 1-10-speaker synthetic
# distribution and doesn't get enough finetune budget/gradient share to
# recalibrate to MSDWild's much narrower real 2-4-speaker one). By
# contrast the same head is fine on RAMC finetune (dev accuracy 90%+) and
# only mediocre-but-plausible at the adapt stage (dev accuracy up to 73%,
# noisy) -- so this ablation only touches the MSDWild finetune stage,
# leaving the shared adapt-stage checkpoint and the sibling RAMC finetune
# (models/10attractors/.../SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h_spkcounting/
# finetune_ramc_10spks_mlp.yaml, unaffected, not duplicated here) untouched.
#
# Note the head is never read at inference (infer.py discards
# spk_counting_logits; RTTM speaker-count decisions come from the
# existence-gating threshold on the attractor logits, a separate path), so
# it cannot itself cause wrong speaker counts in the output RTTMs -- the
# hypothesis being tested here is that it's wasting capacity/injecting
# gradient noise into the *shared* attractor representation during MSDWild
# finetuning specifically, for zero benefit. No clean ablation proving that
# exists yet at this 2500h SC scale; this run is that ablation.
#
# init_model_path points at the UNCHANGED spkcounting lineage's stage-2
# (adapt) checkpoint, same as that lineage's own
# finetune_msdwild_10spks_mlp.yaml -- reused, not retrained, since the
# adapt stage doesn't show the same red flag.
#
# allow_partial_warmstart: true is required here (unlike the sibling
# config's "No allow_partial_warmstart"): the stage-2 checkpoint's
# state_dict has spk_counting_head.* keys that this run's model (built with
# use_spk_counting_head: false) doesn't have a submodule for -- a strict
# load_state_dict would fail on an unexpected-keys mismatch. With
# allow_partial_warmstart, average_checkpoints/_filter_compatible_state_dict
# (diaper/backend/models.py) drops just those incompatible tensors and
# loads everything else (frame encoder, perceiver blocks, attractors,
# existence head, etc.) normally -- see backend/models.py's
# average_checkpoints for the exact mechanism.
#
# init_epochs: 90-100, the repo's standard range for a stage-2 checkpoint
# (unchanged from the sibling config).
#
# After finetuning, evaluate the same way as the other kernel31 MSDWild
# runs:
#   python diaper/eval_checkpoint.py -c <this file> --init-epochs <range>
#   python diaper/analyze_attractor_branch.py -c <this file> --init-epochs <range>
#   python diaper/attractor_collapse_analysis.py -c <this file> --init-epochs <range>
# Score the resulting RTTMs with dscore using --collar 0.25 (MSDWild
# convention -- see CLAUDE.md "Evaluation").

# training options
activation_loss_BCE_weight: 1.0
activation_loss_DER_weight: 0.0
attractor_existence_loss_weight: 1.0
attractor_frame_comparison: dotprod
attractor_diversity_loss_weight: 0.1
spk_counting_loss_weight: 0.0
condition_frame_encoder: True
conformer_conv_kernel_size: 31
conv_norm_type: batchnorm
context_size: 7
d_latents: 128
detach_attractor_loss: False
dev_batchsize: 128
dropout_attractors: 0.1
dropout_frames: 0.1
early_stopping: true
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_encoder_type: conformer
frame_shift: 160
frame_size: 400
use_last_samples: True
gpu: 1
gradclip: 5
allow_partial_warmstart: true
init_epochs: 90-100
init_model_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h_spkcounting_adapted1-10_2500h_maximum10spks_mlp/models
input_transform: logmel_meannorm
intermediate_loss_frameencoder: True
intermediate_loss_perceiver: False
latents2attractors: mlp
log_report_batches_num: 10
lr: 1e-6
max_epochs: 750
model_type: AttractorPerceiver
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
norm_loss_per_spk: True
num_frames: 600
num_speakers: 10
num_workers: 4
num_threads: 1
optimizer: adam
output_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h_spkcounting_headoff_msdwildft/models_finetuneMSDWILD
pre_xa_heads: 4
sampling_rate: 16000
seed: 3
specaugment: False
subsampling: 10
time_shuffle: False
train_batchsize: 32
train_precomputed_dir: /data/ocr/namvt17/dataset/diarization/msdwild_precompute_6000frames/train
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
valid_precomputed_dir: /data/ocr/namvt17/dataset/diarization/msdwild_precompute_6000frames/dev
use_spk_counting_head: false
