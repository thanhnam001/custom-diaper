# Stage 3/3 (pipeline 1, MSDWild): finetune this directory's
# train_10spks_mlp_unmaskeddiv.yaml stage-2 checkpoint on MSDWild.
#
# Single-variable variant of
# SC_LibriSpeech_2spk_conformer_kernel31/finetune_msdwild_10spks_mlp_unmaskeddiv.yaml:
# init_model_path points at THIS (fresh) lineage's stage-2 output instead
# of the patched lineage's. Loss composition is carried forward unchanged
# from stage 2 (attractor_diversity_loss_weight: 0.1,
# attractor_diversity_unmasked_loss_weight: 0.05, latents2attractors: mlp,
# intermediate_loss_perceiver: False) so finetuning doesn't undo whatever
# separation those terms achieved during stage 2.
#
# No allow_partial_warmstart: stage 2's checkpoint already matches this
# config's architecture exactly.
#
# init_epochs: 90-100, the repo's standard range for a stage-2 checkpoint
# (see train.yaml's header in this directory).
#
# After finetuning, evaluate the same way as the other kernel31 MSDWild
# runs:
#   python diaper/eval_checkpoint.py -c <this file> --init-epochs <range>
#   python diaper/analyze_attractor_branch.py -c <this file> --init-epochs <range>
#   python diaper/attractor_collapse_analysis.py -c <this file> --init-epochs <range>
# Score the resulting RTTMs with dscore using --collar 0.25 (MSDWild
# convention -- see CLAUDE.md "Evaluation").

# training options
activation_loss_BCE_weight: 1.0
activation_loss_DER_weight: 0.0
attractor_existence_loss_weight: 1.0
attractor_frame_comparison: dotprod
attractor_diversity_loss_weight: 0.1
attractor_diversity_unmasked_loss_weight: 0.05
condition_frame_encoder: True
conformer_conv_kernel_size: 31
conv_norm_type: batchnorm
context_size: 7
d_latents: 128
detach_attractor_loss: False
dev_batchsize: 128
dropout_attractors: 0.1
dropout_frames: 0.1
early_stopping: true
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_encoder_type: conformer
frame_shift: 160
frame_size: 400
use_last_samples: True
gpu: 1
gradclip: 5
init_epochs: 90-100
init_model_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_adapted1-10_300h_maximum10spks_mlp_unmaskeddiv/models
input_transform: logmel_meannorm
intermediate_loss_frameencoder: True
intermediate_loss_perceiver: False
latents2attractors: mlp
log_report_batches_num: 10
lr: 1e-6
max_epochs: 750
model_type: AttractorPerceiver
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
norm_loss_per_spk: True
num_frames: 600
num_speakers: 10
num_workers: 4
num_threads: 1
optimizer: adam
output_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_adapted1-10_300h_maximum10spks_mlp_unmaskeddiv/models_finetuneMSDWILD
pre_xa_heads: 4
sampling_rate: 16000
seed: 3
specaugment: False
subsampling: 10
time_shuffle: False
train_batchsize: 32
train_precomputed_dir: /data/ocr/namvt17/dataset/diarization/msdwild_precompute_6000frames/train
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
valid_precomputed_dir: /data/ocr/namvt17/dataset/diarization/msdwild_precompute_6000frames/dev
