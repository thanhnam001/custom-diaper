# Inference config for the mlp_fresh lineage's pipeline-1 (WITH unmasked
# diversity loss) RAMC-finetuned checkpoint
# (finetune_ramc_10spks_mlp_unmaskeddiv.yaml's output_path/
# models_finetuneRAMC/models).
#
# Single-variable variant of infer_ramc_mlp.yaml in this directory:
# models_path/rttms_dir point at the mlp_unmaskeddiv experiment instead.
# infer.py doesn't take attractor-diversity-loss-weight/attractor-diversity-
# unmasked-loss-weight/intermediate-loss-* at all (those are training-only),
# so nothing else about the loss composition needs to be carried over here.
#
# median_window_length: 1 (no filtering) / subsampling: 5 follow the paper's
# collar-dependent post-processing rule for RAMC's 0s collar (see CLAUDE.md's
# "Evaluation" section) -- do not copy infer_msdwild*.yaml's values
# (median_window_length: 11 / subsampling: 10) here.
#
# epochs is intentionally left out: no local checkpoints exist yet for this
# lineage under experiments/ on this machine
# (finetune_ramc_10spks_mlp_unmaskeddiv.yaml hasn't finished/synced
# locally), so there's no dev DER curve to pick a range from. Pass it on the
# command line once that run finishes and a best range is picked from
# TensorBoard, e.g.:
#
#   python diaper/infer.py \
#       -c models/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh/infer_ramc_mlp_unmaskeddiv.yaml \
#       --epochs <range> \
#       --infer-data-dir /path/to/other/test/set \
#       --models-path /path/to/other/models \
#       --rttms-dir /path/to/output

# inference options
condition_frame_encoder: True
conformer_conv_kernel_size: 31
conv_norm_type: batchnorm
context_size: 7
d_latents: 128
dropout_attractors: 0.1
dropout_frames: 0.1
estimate_spk_qty: -1
estimate_spk_qty_thr: 0.5
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_encoder_type: conformer
frame_shift: 160
frame_size: 400
gpu: 1
infer_data_dir: /data/ocr/namvt17/dataset/diarization/ramc/kaldi/test
input_transform: logmel_meannorm
latents2attractors: mlp
median_window_length: 1
model_type: AttractorPerceiver
models_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_adapted1-10_300h_maximum10spks_mlp_unmaskeddiv/models_finetuneRAMC/models
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
num_frames: -1
num_speakers: 10
pre_xa_heads: 4
rttms_dir: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_adapted1-10_300h_maximum10spks_mlp_unmaskeddiv/models_finetuneRAMC/ramc_test_pred
sampling_rate: 16000
seed: 3
subsampling: 5
time_shuffle: False
threshold: 0.5
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
