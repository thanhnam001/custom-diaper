# Stage 2/3: adapt the 2-speaker pretrained model to 1-10 speakers using the
# 300h "maximum 10 speakers" simulated dataset. init_model_path points at
# stage 1's checkpoints (models/10attractors/SC_LibriSpeech_2spk_linear_diversity/train.yaml).
#
# Same recipe as models/10attractors/SC_LibriSpeech_2spk_adapted1-10/train_10spks.yaml,
# but latents2attractors: linear (bug-fixed) and the diversity loss enabled.
# noam_model_size / noam_warmup_steps are again auto-computed by train.py.

# training options
activation_loss_BCE_weight: 1.0
activation_loss_DER_weight: 0.0
attractor_diversity_loss_weight: 0.01 # see train.yaml comment; retune from
  # the attractor_diversity_loss TensorBoard scalar if needed
attractor_existence_loss_weight: 1.0
attractor_frame_comparison: dotprod
condition_frame_encoder: True
context_size: 7
d_latents: 128
detach_attractor_loss: False
dev_batchsize: 32
dropout_attractors: 0.1
dropout_frames: 0.1
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_shift: 160
frame_size: 400
use_last_samples: True
gpu: 1
gradclip: 5
input_transform: logmel_meannorm
intermediate_loss_frameencoder: True
intermediate_loss_perceiver: True
latents2attractors: linear
log_report_batches_num: 24 # need recompute if batch size/dataset size change
max_epochs: 100
model_type: AttractorPerceiver
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
noam_warmup_fraction: 0.10
norm_loss_per_spk: True
num_frames: 2400
num_speakers: 10
num_workers: 4
num_threads: 1
optimizer: noam
output_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_linear_diversity_adapted1-10_300h_maximum10spks
pre_xa_heads: 4
sampling_rate: 16000
seed: 3
specaugment: False
subsampling: 10
time_shuffle: False
train_batchsize: 20
train_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_300h_maximum_10spks_24000frames/train
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
valid_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_300h_maximum_10spks_24000frames/validation
init_epochs: 90-100
init_model_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_linear_diversity_pretrain500h/models
