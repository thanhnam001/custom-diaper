# Stage 3-alt: finetune the SAME E-Branchformer(mlp) paperlr adapt
# checkpoint (SC_LibriSpeech_2spk_2500h_paperlr_ebranchformer/
# train_10spks.yaml's output) on MSDWild, but at subsampling: 5 instead of
# the sibling finetune_msdwild_10spks.yaml's subsampling: 10 -- see
# models/10attractors/SC_LibriSpeech_2spk_2500h_paperlr_subsampling5/
# finetune_msdwild_10spks.yaml for the full rationale (median-filter
# overlap fabrication measurement, the already-ruled-out inference-only
# subsampling-5 mismatch, the O(T^2) self-attention memory warning) --
# this is the same experiment applied to E-Branchformer(mlp) instead of
# plain self-attention, chosen over the "current best" headoff conformer
# because that lineage predates the paperlr Noam-schedule fix and would
# confound this comparison with that separate, already-diagnosed
# deficiency (see [[diaper-paperlr-noam-fix]]) -- this lineage shares the
# exact corrected adapt-stage checkpoint the subsampling5 self-attention
# baseline was built from, so the two experiments are comparable.
#
# CRITICAL DIFFERENCE FROM THE SELF-ATTENTION VERSION -- KERNEL SIZE IS
# DELIBERATELY *NOT* SCALED:
# E-Branchformer's two depthwise convs (--ebranchformer-cgmlp-kernel-size /
# --ebranchformer-merge-kernel-size, diaper/backend/models.py:897-922,
# both left at their default 31 by this whole lineage -- neither is set in
# any of this lineage's yamls) have a FIXED receptive field of 31
# subsampled frames = 3.1s at subsampling 10. At subsampling 5 that same
# 31-tap kernel only spans 1.55s of wall-clock audio -- exactly the
# fixed-kernel handicap documented in
# [[diaper-sc-scale-and-eval-resolution]] as why conv-based encoders
# degraded MORE than self-attention under the (already-ruled-out)
# inference-only resolution mismatch.
#
# The obvious fix -- double both kernel sizes to 61 to preserve the 3.1s
# receptive field -- does NOT work here the way num_frames doubling does
# for sequence length: kernel_size is baked into the trained depthwise
# conv weight tensor's SHAPE. Loading a 31-tap checkpoint into a 61-tap
# model requires --allow-partial-warmstart (train.py, "tolerate checkpoint
# tensors whose key or shape no longer matches ... by skipping just those
# tensors and keeping their fresh random init"), which would randomly
# reinitialize BOTH conv layers in all 4 E-Branchformer blocks. This
# stage's lr: 1e-6 is tuned for fine-tuning an already-good model, not for
# training fresh conv weights from scratch -- there is no reason to expect
# it converges those layers in a 750-epoch (realistically ~500-epoch,
# matching this lineage's early-stopping history) finetune budget. Rather
# than introduce that confound (and a second free variable -- what LR
# would freshly-initialized conv layers even need), this config leaves
# kernel_size at 31 unchanged, cleanly warm-starts every weight from the
# existing checkpoint with the default strict load_state_dict, and treats
# the halved receptive field as a known, accepted limitation of this
# specific experiment -- not something to silently paper over. If the
# result reads as inconclusive relative to the self-attention sibling,
# check whether this halved receptive field (not the resolution change
# itself) is why before concluding architecture doesn't matter here.
#
# WHAT CHANGED vs. the sibling finetune_msdwild_10spks.yaml (diff the two
# files to confirm nothing else drifted):
#   subsampling:  10 -> 5
#   num_frames:  600 -> 1200     (doubled to hold the wall-clock chunk
#                                  length fixed at 60s, same reasoning as
#                                  the self-attention sibling; also exactly
#                                  matches the existing msdwild_precompute_
#                                  6000frames cache's 6000-raw-frame chunks,
#                                  no re-precompute needed)
#   output_path: ..._finetuneMSDWILD -> ..._finetuneMSDWILD_subsampling5
#
# COMPUTE WARNING: use_frame_selfattention: True is still True for
# E-Branchformer (each block runs self-attention AND the conv branch in
# parallel, then merges -- see EBranchformerBlock), so the same O(T^2)
# self-attention memory/compute warning from the self-attention sibling
# config applies here too: doubling num_frames at fixed train_batchsize: 32
# is ~4x the attention-matrix cost per step. Halve train_batchsize to 16
# first if this OOMs.
#
# NOT a replacement for finetune_msdwild_10spks.yaml -- report as an
# additional row, alongside the self-attention subsampling5 result.
#
# Run (server): ./scripts/run_finetune_2500h_paperlr_ebranchformer_subsampling5.sh
# Then infer:   ./scripts/run_infer_2500h_paperlr_ebranchformer_subsampling5.sh
#   (median-window sweep, same reasoning as the self-attention sibling's
#   infer script -- do not assume 11 or RAMC's 1 carries over unchanged)

# training options
activation_loss_BCE_weight: 1.0
activation_loss_DER_weight: 0.0
attractor_existence_loss_weight: 1.0
attractor_frame_comparison: dotprod
attractor_diversity_loss_weight: 0.1
condition_frame_encoder: True
context_size: 7
d_latents: 128
detach_attractor_loss: False
dev_batchsize: 128
dropout_attractors: 0.1
dropout_frames: 0.1
early_stopping: true
early_stopping_patience: 100
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_type: ebranchformer
frame_encoder_units: 2048
frame_shift: 160
frame_size: 400
use_last_samples: True
gpu: 1
gradclip: 5
init_epochs: 90-100
init_model_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_2500h_paperlr_ebf_adapted1-10_2500h_maximum10spks_mlp/models
input_transform: logmel_meannorm
intermediate_loss_frameencoder: True
intermediate_loss_perceiver: False
l2a_entropy_loss_weight: 0.0
latents2attractors: mlp
log_report_batches_num: 10
lr: 1e-6
max_epochs: 750
model_type: AttractorPerceiver
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
norm_loss_per_spk: True
num_frames: 1200
num_speakers: 10
num_workers: 4
num_threads: 1
optimizer: adam
output_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_2500h_paperlr_ebf_adapted1-10_2500h_maximum10spks_mlp/models_finetuneMSDWILD_subsampling5
pre_xa_heads: 4
sampling_rate: 16000
seed: 3
specaugment: False
subsampling: 5
time_shuffle: False
train_batchsize: 32
train_precomputed_dir: /data/ocr/namvt17/dataset/diarization/msdwild_precompute_6000frames/train
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
valid_precomputed_dir: /data/ocr/namvt17/dataset/diarization/msdwild_precompute_6000frames/dev
