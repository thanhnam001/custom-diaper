# Inference config for this lineage's MSDWild-finetuned checkpoint
# (finetune_msdwild_10spks.yaml's output_path/models).
#
# Architecture options must stay in sync with train.yaml /
# train_10spks.yaml / finetune_msdwild_10spks.yaml in this directory
# (self_attention frame encoder, latents2attractors: weighted_average --
# the paper's own baseline). The Noam-schedule changes that define this
# lineage are training-time only and have no inference-side counterpart.
#
# median_window_length: 11 / subsampling: 10 follow the paper's
# collar-dependent post-processing rule for MSDWild's 0.25s collar
# (Section IV.D). Do NOT copy infer_ramc.yaml's values (median 1 /
# subsampling 5) here -- those are for 0s-collar scoring. See CLAUDE.md's
# "Evaluation" section.
#
# epochs is intentionally omitted: no checkpoints exist for this lineage
# yet. scripts/run_infer_2500h_paperlr.sh auto-detects and averages the
# last 10 checkpoints, or pass a range explicitly:
#
#   python diaper/infer.py \
#       -c models/10attractors/SC_LibriSpeech_2spk_2500h_paperlr/infer_msdwild.yaml \
#       --epochs <range> --num-threads 4
#
# Target for comparison: Table XIII row (6), MSDWild DER 15.5 with the
# paper's own shipped 10-attractor checkpoint. The sibling
# SC_LibriSpeech_2spk_2500h lineage reached 19.12 here.

# inference options
condition_frame_encoder: True
context_size: 7
d_latents: 128
dropout_attractors: 0.1
dropout_frames: 0.1
estimate_spk_qty: -1
estimate_spk_qty_thr: 0.5
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_type: self_attention
frame_encoder_units: 2048
frame_shift: 160
frame_size: 400
gpu: 1
infer_data_dir: /data/ocr/namvt17/dataset/diarization/msdwild/kaldi/test
input_transform: logmel_meannorm
latents2attractors: weighted_average
median_window_length: 11
model_type: AttractorPerceiver
models_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_2500h_paperlr_adapted1-10_2500h_maximum10spks/models_finetuneMSDWILD/models
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
num_frames: -1
num_speakers: 10
pre_xa_heads: 4
rttms_dir: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_2500h_paperlr_adapted1-10_2500h_maximum10spks/models_finetuneMSDWILD/msdwild_test_pred
sampling_rate: 16000
seed: 3
subsampling: 10
time_shuffle: False
threshold: 0.5
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
