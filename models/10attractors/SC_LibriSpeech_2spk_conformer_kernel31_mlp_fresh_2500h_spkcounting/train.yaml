# Stage 1/3 (SHARED): pretrain on 2-speaker LibriSpeech-simulated
# conversations with latents2attractors: mlp from the start.
#
# Same recipe as
# SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h/train.yaml (row 17,
# 2500h SC scale) -- the only change in this directory is
# use_spk_counting_head: true / spk_counting_loss_weight: 1.0, adding the
# classification-based speaker-counting auxiliary head (see
# diaper/backend/models.py::AttractorPerceiver, "Speaker-counting head"
# comment) alongside the existing --att-qty-loss-weight regression, trained
# from stage 1 onward.
#
# use_spk_counting_head is a model-architecture flag, not just a loss
# toggle (it changes the state_dict) -- set true here in stage 1 and kept
# true in every downstream stage in this directory (train_10spks_mlp.yaml,
# finetune_msdwild_10spks_mlp.yaml, finetune_ramc_10spks_mlp.yaml) so every
# checkpoint in the lineage has the same architecture and strict
# load_state_dict (no allow_partial_warmstart) keeps working stage to
# stage, matching this lineage's existing convention. Stage 1's data is
# fixed at 2 speakers, so the counting task is degenerate here (always
# "2") -- harmless, and it warms up the head's weights before stage 2's
# 1-10 speaker data makes the task non-trivial.
#
# DDP (--gpu > 1): spk_counting_loss_weight > 0 used to hang forever at
# loss.backward() under DDP (model.module.get_speaker_counting_logits(...)
# was called after model.forward() already returned, invisible to DDP's
# find_unused_parameters=True traversal -- see commit b60f9cf's comment in
# _wrap_ddp for the original writeup). Fixed by computing it inside
# AttractorPerceiver.forward() instead (commit e070e00) -- multi-GPU DDP
# now works for this lineage. --speakerid-loss is unrelated and still not
# fixed, but none of this lineage's configs set it.
#
# See SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h/train.yaml's
# header for the rest of the rationale (2500h SC scaling, noam warmup,
# batch sizes, masked diversity loss) -- unchanged here.
#
# train_precomputed_dir / valid_precomputed_dir are placeholders, same as
# the sibling lineage -- fill in once the 2500h SC precompute finishes.
#
# This checkpoint is the starting point for this lineage's stage 2
# (train_10spks_mlp.yaml in this directory).

# training options
activation_loss_BCE_weight: 1.0
activation_loss_DER_weight: 0.0
attractor_existence_loss_weight: 1.0
attractor_frame_comparison: dotprod
attractor_diversity_loss_weight: 0.1
spk_counting_loss_weight: 1.0
condition_frame_encoder: True
conformer_conv_kernel_size: 31
conv_norm_type: batchnorm
context_size: 7
d_latents: 128
detach_attractor_loss: False
dev_batchsize: 80
dropout_attractors: 0.1
dropout_frames: 0.1
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_encoder_type: conformer
frame_shift: 160
frame_size: 400
use_last_samples: True
gpu: 1
gradclip: 5
input_transform: logmel_meannorm
intermediate_loss_frameencoder: True
intermediate_loss_perceiver: True
latents2attractors: mlp
log_report_batches_num: 20
max_epochs: 100
model_type: AttractorPerceiver
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
noam_warmup_fraction: 0.10
norm_loss_per_spk: True
num_frames: 600
num_speakers: 2
num_workers: 4
num_threads: 1
optimizer: noam
output_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h_spkcounting_pretrain2500h
pre_xa_heads: 4
sampling_rate: 16000
seed: 3
specaugment: False
subsampling: 10
time_shuffle: False
train_batchsize: 80
train_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_2500h_fixed_2spks/train
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
valid_precomputed_dir: /data/ocr/namvt17/dataset/diarization/diaper_precompute_2500h_fixed_2spks/validation
use_spk_counting_head: true
