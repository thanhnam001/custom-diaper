# Inference config for this directory's (2500h pretrain+adapt scale,
# speaker-counting head on) MSDWild-finetuned checkpoint
# (finetune_msdwild_10spks_mlp.yaml's output_path/models_finetuneMSDWILD/models).
#
# Same as
# SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h/infer_msdwild_mlp.yaml,
# plus use_spk_counting_head: true -- required to match this lineage's
# checkpoint architecture (get_model() builds the spk_counting_head
# submodule only when this is set, and the checkpoint's state_dict has
# those keys; without it here, load_state_dict would fail on an
# unexpected-keys mismatch). The head itself doesn't affect inference
# output (only estimate_diarization_outputs' existing diarization/
# attractor logits are used), it's purely an architecture-matching
# requirement.
#
# median_window_length: 11 / subsampling: 10 follow the paper's
# collar-dependent post-processing rule for MSDWild's 0.25s collar (see
# CLAUDE.md's "Evaluation" section) -- do not copy infer_ramc*.yaml's values
# (median_window_length: 1 / subsampling: 5) here.
#
# epochs is intentionally left out: no checkpoints exist yet for this
# lineage. Pass it on the command line once the finetune run finishes and a
# best range is picked from TensorBoard, e.g.:
#
#   python diaper/infer.py \
#       -c models/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h_spkcounting/infer_msdwild_mlp.yaml \
#       --epochs <range> \
#       --num-threads 4

# inference options
condition_frame_encoder: True
conformer_conv_kernel_size: 31
conv_norm_type: batchnorm
context_size: 7
d_latents: 128
dropout_attractors: 0.1
dropout_frames: 0.1
estimate_spk_qty: -1
estimate_spk_qty_thr: 0.5
feature_dim: 40
frame_encoder_heads: 4
frame_encoder_layers: 4
frame_encoder_units: 2048
frame_encoder_type: conformer
frame_shift: 160
frame_size: 400
gpu: 1
infer_data_dir: /data/ocr/namvt17/dataset/diarization/msdwild/kaldi/test
input_transform: logmel_meannorm
latents2attractors: mlp
median_window_length: 11
model_type: AttractorPerceiver
models_path: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h_spkcounting_adapted1-10_2500h_maximum10spks_mlp/models_finetuneMSDWILD/models
n_attractors: 10
n_blocks_attractors: 3
n_internal_blocks_attractors: 1
n_latents: 128
n_selfattends_attractors: 2
n_sa_heads_attractors: 4
n_xa_heads_attractors: 4
num_frames: -1
num_speakers: 10
pre_xa_heads: 4
rttms_dir: /data/ocr/namvt17/custom-diaper/experiments/10attractors/SC_LibriSpeech_2spk_conformer_kernel31_mlp_fresh_2500h_spkcounting_adapted1-10_2500h_maximum10spks_mlp/models_finetuneMSDWILD/msdwild_test_pred
sampling_rate: 16000
seed: 3
subsampling: 10
time_shuffle: False
threshold: 0.5
use_frame_selfattention: True
use_posenc: False
use_pre_crossattention: True
use_spk_counting_head: true
